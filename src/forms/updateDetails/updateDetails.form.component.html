<div class="form-page"  >
  <div class="form-card">

    <div class="avatar-wrapper">
      <img [src]="'../assets/' + currUserDetails?.avatar"  class="avatar-img" />
    </div>

    <h2 class="form-title">Update Details</h2>

    <form [formGroup]= "updateDetailsForm" (ngSubmit)="updateDetails()">

      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" />
      </div>
<!-- 
      <div class="form-group">
        <label for="avatar">Avatar URL</label>
        <input id="avatar" type="text" formControlName="avatar" />
      </div> -->

      <div class="form-group">
        <label for="brief">Brief</label>
        <textarea id="brief" rows="5" formControlName="brief"></textarea>
      </div>

      <div class="form-group">
        <label for="passwd">Confirm Password</label>
        <input id="passwd" type="password" formControlName="passwd" placeholder="Required to save changes" />
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="router.navigate(['/'])">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="updateDetailsForm.invalid" >Save</button>
      </div>
    </form>

  </div>
</div>
