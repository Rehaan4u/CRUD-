<div class="user-card" *ngIf="reqUser">
  <img [src]="'../assets/'+reqUser.avatar" alt="{{ reqUser.name }} avatar" class="user-card__avatar" />
  <h3 class="user-card__name">{{ reqUser.name }}</h3>
  <p class="user-card__brief">{{ reqUser.brief }}</p>

  <div class="user-card__actions">
    <button class="user-card__button" (click)="updateClicked()">Update Details</button>
    <button class="user-card__button user-card__button--secondary" (click)="add()">Add User</button>
  </div>
</div>
